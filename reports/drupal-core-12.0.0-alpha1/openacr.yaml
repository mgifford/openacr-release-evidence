title: Drupal Core 12.0.0-alpha1 Accessibility Conformance Report — DRAFT
product:
  name: Drupal Core
  version: 12.0.0-alpha1
  description: Drupal 12.0.0-alpha1 standard profile. Claro is the administration
    theme; Default Admin is present but not the default in this alpha. Claro and Olivero
    are still core themes at this tag. This is a pre-release target, not a supported
    release.
author:
  name: Unassigned reviewer (draft)
  email: reviewer@example.invalid
report_date: '2026-11-10'
last_modified_date: '2026-11-10'
version: 1
notes: 'DRAFT OpenACR skeleton for Drupal Core 12.0.0-alpha1 (tag 12.0.0-alpha1).
  Evidence report: index.html. Machine-readable evidence: evidence.json. Evidence
  digest: 669c4431ab7c27c32757c52e3b2ba5fd7bc9357381edd2757dc6797b8bb33935. Component
  scope: Web and Authoring Tool are proposed Partially Supports; Electronic Documents
  and Software are proposed Not Applicable. These are proposed component labels only.
  Evidence scope: active/review-relevant issues only (Active, Needs review, Needs
  work, RTBC, Patch); fixed and closed issues are excluded. Some active issues are
  metadata-only inventory records; complete comments/merge-request evidence was collected
  only for a review-priority subset. Issue-tagged criteria carry draft partially-supports
  values for Web and Authoring Tool; criteria without a tagged issue remain unset
  and Not Evaluated. Electronic Documents and Software are marked not-applicable for
  Drupal Core. The author is a placeholder; a human reviewer must replace it, confirm
  every value and explanation, and run `acr-evidence openacr-validate --file openacr.yaml
  --strict` before publishing. An ACR narrative is at acr.html; it presents the same
  draft issue-queue evaluation. ATAG 2.0 authoring evidence is tracked separately
  at ../drupal-core-atag/index.html; this OpenACR does not populate ATAG criteria
  or the authoring-tool component. This file has not been round-tripped through the
  Civicactions/GSA ACR editor.'
evaluation_methods_used: No WCAG-EM sample was evaluated; this is an issue-queue-based
  draft, not a completed ACR. Public Drupal.org issue-queue evidence collection, commit/tag
  containment analysis, and explicit WCAG candidate tag grouping were used. Open issue
  reports are treated as proposed barrier evidence; no issue was reproduced against
  this release. No manual keyboard, screen-reader or assistive-technology testing
  was performed. A human reviewer must confirm the draft values.
legal_disclaimer: DRAFT for human review. This is not a final Accessibility Conformance
  Report, does not certify conformance, and must not be published as a vendor ACR
  until reviewed and approved.
