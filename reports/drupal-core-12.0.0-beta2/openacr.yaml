title: Drupal Core 12.0.0-beta2 Accessibility Conformance Report — DRAFT
product:
  name: Drupal Core
  version: 12.0.0-beta2
  description: Drupal 12.0.0-beta2 standard profile. Default Admin is the default
    and administration theme; Claro and Olivero are no longer core themes at this
    tag. This is a pre-release target, not a supported release.
author:
  name: Unassigned reviewer (draft)
  email: reviewer@example.invalid
report_date: '2026-11-12'
last_modified_date: '2026-11-12'
version: 1
notes: 'DRAFT OpenACR skeleton for Drupal Core 12.0.0-beta2 (tag 12.0.0-beta2). Evidence
  report: index.html. Machine-readable evidence: evidence.json. Evidence digest: 738a8025a4887e32c11331b4684bf09473ce0b589d69641fa0d1ec93bf604b2b.
  Component scope: Web and Authoring Tool use the declared Drupal surface assessment
  and known-barrier register; Electronic Documents and Software are Not Applicable
  from documented product scope. No Does Not Support value is recorded. Evidence scope:
  active/review-relevant issues only (Active, Needs review, Needs work, RTBC, Patch);
  fixed and closed issues are excluded. Some active issues are metadata-only inventory
  records; complete comments/merge-request evidence was collected only for a review-priority
  subset. Known issues produce Partially Supports; an assessed surface with no known
  issue produces Supports. Issue evidence is recorded in criterion-evidence.json.
  Electronic Documents and Software are marked not-applicable for Drupal Core. The
  author is a placeholder; a human reviewer must replace it, confirm every value and
  explanation, and run `acr-evidence openacr-validate --file openacr.yaml --strict`
  before publishing. An ACR narrative is at acr.html; it presents the same draft issue-queue
  evaluation. ATAG 2.0 authoring evidence is tracked separately at ../drupal-core-atag/index.html;
  this OpenACR does not populate ATAG criteria or the authoring-tool component. This
  file has not been round-tripped through the Civicactions/GSA ACR editor.'
evaluation_methods_used: No WCAG-EM sample was evaluated; this is an issue-queue-based
  draft, not a completed ACR. Public Drupal.org issue-queue evidence collection, commit/tag
  containment analysis, and explicit WCAG candidate tag grouping were used. Open issue
  reports are treated as proposed barrier evidence; no issue was reproduced against
  this release. No manual keyboard, screen-reader or assistive-technology testing
  was performed. A human reviewer must confirm the draft values.
legal_disclaimer: DRAFT for human review. This is not a final Accessibility Conformance
  Report, does not certify conformance, and must not be published as a vendor ACR
  until reviewed and approved.
