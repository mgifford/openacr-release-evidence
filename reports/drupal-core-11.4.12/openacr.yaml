notes: 'DRAFT OpenACR skeleton for Drupal Core 11.4.12 (tag 11.4.12). Evidence report:
  index.html. Machine-readable evidence: evidence.json. Evidence digest: e307e37d44a1ba680bd2c8ef2debaf738fe5de581dcd401a88029d696e6a1338.
  Evidence scope: active/review-relevant issues only (Active, Needs review, Needs
  work, RTBC, Patch); fixed and closed issues are excluded. Some active issues are
  metadata-only inventory records; complete comments/merge-request evidence was collected
  only for a review-priority subset. No WCAG conformance values are populated. The
  author is a placeholder; a human reviewer must replace it, assess every criterion,
  select components and adherence levels, and run `acr-evidence openacr-validate --file
  openacr.yaml --strict` before publishing. An ACR narrative is at acr.html; it assigns
  no ACR result and marks the evaluation Not Evaluated. ATAG 2.0 authoring evidence
  is tracked separately at ../drupal-core-atag/index.html; this OpenACR does not populate
  ATAG criteria or the authoring-tool component. This file has not been round-tripped
  through the Civicactions/GSA ACR editor.'
evaluation_methods_used: No WCAG-EM sample was evaluated; this is an evidence-only
  skeleton, not a completed ACR. Public Drupal.org issue-queue evidence collection,
  commit/tag containment analysis, and explicit WCAG candidate tag grouping were used.
  No manual keyboard, screen-reader or assistive-technology testing of the target
  was performed in this phase. A human reviewer must complete the evaluation and select
  the OpenACR adherence values.
legal_disclaimer: DRAFT for human review. This is not a final Accessibility Conformance
  Report, does not certify conformance, and must not be published as a vendor ACR
  until reviewed and approved.
