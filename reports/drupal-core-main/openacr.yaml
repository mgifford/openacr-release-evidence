title: Drupal Core 12.0.x-dev Accessibility Conformance Report — DRAFT
product:
  name: Drupal Core
  version: 12.0.x-dev
  description: Drupal Core main/12.0.x development branch. Default Admin is the default
    and administration theme; Claro and Olivero are contributed projects. This is
    a development target, not a release, and its findings can change at any commit.
