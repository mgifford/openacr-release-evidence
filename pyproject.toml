[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openacr-release-evidence"
version = "0.2.0"
description = "Release-scoped accessibility evidence for draft OpenACRs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "contributors to openacr-release-evidence" }]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6,<7"]
openacr = ["PyYAML>=6,<7", "jsonschema>=4.18,<5"]

[project.urls]
Documentation = "https://github.com/mgifford/openacr-release-evidence/blob/main/README.md"
Source = "https://github.com/mgifford/openacr-release-evidence"

[project.scripts]
acr-evidence = "acr_evidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acr_evidence = ["static/*.html", "static/*.js", "static/*.css", "standards/openacr/*"]
