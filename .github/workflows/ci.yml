name: Test evidence pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[yaml]'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check syntax
        run: python -m compileall -q src
      - name: Build synthetic explorer
        run: acr-evidence build --manifest config/drupal-core-example.json --issues tests/fixtures/issues.json --output site
      - name: Verify committed target reports are reproducible
        run: |
          for dir in reports/drupal-core-*; do
            [ -f "$dir/analysis.json" ] || continue
            name="$(basename "$dir")"
            acr-evidence report --analysis "$dir/analysis.json" --output "/tmp/rebuilt-$name"
            for file in index.html evidence.json summary.json report.css; do
              diff "$dir/$file" "/tmp/rebuilt-$name/$file"
            done
          done
      - name: Upload synthetic preview (not published)
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-evidence-preview
          path: site/
          retention-days: 7
