name: Test evidence pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e '.[yaml]'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check syntax
        run: python -m compileall -q src
      - name: Build synthetic explorer
        run: acr-evidence build --manifest config/drupal-core-example.json --issues tests/fixtures/issues.json --output site
      - name: Verify committed report is reproducible
        run: |
          acr-evidence report --analysis reports/drupal-core-11.4.12/analysis.json --output /tmp/rebuilt-report
          diff reports/drupal-core-11.4.12/index.html /tmp/rebuilt-report/index.html
          diff reports/drupal-core-11.4.12/evidence.json /tmp/rebuilt-report/evidence.json
          diff reports/drupal-core-11.4.12/summary.json /tmp/rebuilt-report/summary.json
          diff reports/drupal-core-11.4.12/report.css /tmp/rebuilt-report/report.css
      - name: Upload synthetic preview (not published)
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-evidence-preview
          path: site/
          retention-days: 7
