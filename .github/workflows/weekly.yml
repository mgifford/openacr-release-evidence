# Generate a weekly, review-gated evidence snapshot and open a PR.
#
# This does not publish automatically. The PR must be reviewed and merged; the
# Pages workflow then deploys the reviewed reports. GITHUB_TOKEN-created PRs do
# not trigger other workflows, so this job runs the test suite and explicitly
# dispatches the CI workflow on the generated branch.
name: Weekly Drupal Core evidence snapshot

on:
  schedule:
    # Mondays 13:00 UTC (09:00 America/Toronto during EDT).
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: weekly-evidence
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e '.[openacr]'
      - name: Verify code before generating a snapshot
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q src
      - name: Install drupalorg-cli
        run: |
          php -v
          composer --version
          composer global require mglaman/drupalorg-cli --no-interaction --no-progress
          BIN_DIR="$(composer global config bin-dir --absolute)"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          echo "ACR_DRUPALORG_BIN=$BIN_DIR/drupalorg" >> "$GITHUB_ENV"
      - name: Collect the shared Drupal Core accessibility sample
        run: |
          acr-evidence collect \
            --manifest config/drupal-core-11.4.12.json \
            --output reports/collection.json \
            --raw-dir private-evidence/raw \
            --cache-dir .cache/acr-evidence
      - name: Collect ATAG 2.0 authoring evidence
        run: |
          acr-evidence collect \
            --manifest config/drupal-core-atag.json \
            --output reports/drupal-core-atag/collection.json \
            --raw-dir private-evidence/raw \
            --cache-dir .cache/acr-evidence
      - name: Render ATAG evidence and WAI ATAG Report Tool draft
        run: |
          acr-evidence atag-report \
            --collection reports/drupal-core-atag/collection.json \
            --output reports/drupal-core-atag
      - name: Analyze supported, pre-release and development targets
        run: |
          acr-evidence multi \
            --collection reports/collection.json \
            --targets config/drupal-core-targets.json \
            --output reports \
            --cache-dir .cache/acr-evidence
      - name: Open a review PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "openacr-evidence-bot"
          git config user.email "openacr-evidence-bot@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "No report changes this week."
            exit 0
          fi
          STAMP="$(date -u +%Y%m%dT%H%MZ)"
          BRANCH="automated/weekly-evidence-$STAMP"
          git switch -c "$BRANCH"
          git commit -m "chore: weekly Drupal Core evidence snapshot $(date -u +%F)"
          git push -u origin "$BRANCH"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "Weekly Drupal Core evidence snapshot $(date -u +%F)" \
            --body "Automated weekly snapshot of the declared Drupal Core targets.

          Targets: 10.6.21 (supported), 11.4.12 (supported), 12.0.0-alpha1 (pre-release), 12.0.0-beta2 (pre-release) and main (development). The collection contains active review-relevant issues only (statuses 1, 8, 13, 14, 15); fixed/closed/postponed issues are excluded. Some active issues are metadata-only inventory records.

          This PR was generated by the weekly workflow and has not been reviewed. Merging it is the publication review event; the Pages workflow then deploys the allowlisted reports. See \`reports/index.html\` for the cross-release matrix, \`reports/drupal-core-atag/\` for separate ATAG 2.0 authoring evidence, and \`AUDIT.md\` for known limitations. ATAG Part A/B candidates are triage hints, not conformance results.

          The generation job ran the offline test suite before opening the PR. Because PRs created with \`GITHUB_TOKEN\` do not trigger other workflows, CI is dispatched explicitly on the generated branch."
          gh workflow run "Test evidence pipeline" --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
